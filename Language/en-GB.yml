  STR_HIGH_ACCESS_LEVEL: "High Access Level"
  STR_HIGH_ACCESS_LEVEL_UFOPEDIA: "Commander! After the final report to the UN and the assignment of the status of UFO DEFENCE to us, I held a series of official consultations with influential security services of the Council member states and made some very useful contacts. As a result, we have access to some government databases and closed information networks, which is very important for effective suspect search, rumour checking and information analysis. Unfortunately, the volume of transmitted and processed data requires considerable computing capabilities, and we will need new equipment. I propose to modernise the project of the intelligence centre.{NEWLINE}Oh, and I will also agree to install there an incredibly useful device that displays all the biological metrics of the person being interrogated on a huge display to determine the effectiveness of the applied methods of tort... oh, I wanted to say, inquest."
  STR_DOGE_TRACK: "Track"
  STR_DOGE_BARK: "Dog Bark"
  STR_DOGE_BITE: "Dog Bite"
  STR_SOLDIER_LIST: "Agent List"
  STR_DRAGONFLY_DARK: "Dragonfly"
  STR_MASS_DRIVER_CANNON_ROUNDS_X60: "Craft Mass Driver Rounds (x60)"
  STR_GAUSS_CANNON_UC: "GAUSS CANNON"
  STR_GAUSS_CANNON: "Gauss Cannon"
  STR_GAUSS_CANNON_ROUNDS_X60: "Craft Gauss Cannon Rounds (x60)"
  STR_STORMLANCE: "STORMLANCE"
  STR_STORMLANCE_MISSILE: "Stormlance Missile"
  STR_STORMLANCE_MISSILES: "Stormlance Missiles"
  STR_STORMLANCE_LAUNCHER: "Stormlance Missile Launcher"
  STR_POSTAL2_ARMOR_ADAPTATION: "Insane Vigilante Processing"
  STR_POSTAL_RAMPAGE_DESCRIPTION: "A self-styled vigilante learned some closely guarded secrets regarding the aliens, the government and other associated topics. This shock pushed him over the edge to become an extremist and plan a terrorist attack to bring the population's attention to the ongoing secret war.{NEWLINE}We must apprehend and eliminate him before he kills too many people. Consider him armed (to ridiculous levels) and a significant threat to your agents."
  STR_POSTAL_RAMPAGE_BRIEFING: "A self-styled vigilante learned some closely guarded secrets regarding the aliens, the government and other associated topics. This shock prompted him to become an extremist (this time a really hardcore one) and plan a terrorist attack to bring the population's attention to the ongoing secret war. We must apprehend and eliminate him before he kills too many people. To abort the mission return X-Com operatives to the transport vehicle and click on the 'Abort Mission' icon."
  STR_DARK_ONE_RAMPAGE_DESCRIPTION: "Local authorities informed us about an extremist and self-styled vigilante who started a terrorist attack to bring the population's attention to the ongoing secret war and the existence of aliens and other horrors. However, the details are peculiar and we suspect the 'extremist' can be something inhuman.{NEWLINE}Whatever the case, we must apprehend and eliminate him before he kills too many people. Consider him extremely dangerous to your agents."
  STR_DARK_ONE_RAMPAGE_BRIEFING: "Local authorities informed us about an extremist and self-styled vigilante who started a terrorist attack to bring the population's attention to the ongoing secret war and the existence of aliens and other horrors. However, the details are peculiar and we suspect the 'extremist' can be something inhuman.{NEWLINE}Whatever the case, we must apprehend and eliminate him before he kills too many people. Consider him extremely dangerous to your agents. To abort the mission return X-Com operatives to the transport vehicle and click on the 'Abort Mission' icon."
  STR_FARMER: "Farmer"
  STR_MACRO_SMG_BUY: "BlackOps Macro SMG Acquisition"
  STR_M14: "M14"
  STR_FN_FAL: "FN FAL"
  STR_PRIME_FLARE: "Prime Flare"
  STR_PRIME_MINE: "Prime Mine"
  STR_UNPRIME_GRENADE: "Unprime Grenade"
  STR_UNPRIME_MINE: "Disable Mine"
  STR_FLARE_IS_ACTIVATED: "Flare is Activated!"
  STR_MINE_IS_ACTIVATED: "Mine is Activated!"
  STR_MINE_IS_DEACTIVATED: "Mine is De-activated!"
  STR_MELEE_UFOPEDIA: "For most fighters, melee weapons are only for desperate situations, but some agents rather enjoy their strong points: power and speed."
  STR_PISTOLS_UFOPEDIA: "Pistols have a number of advantages: they suffer no penalty from one-handed use, are fast-firing, light and easy to carry. Their main problem is limited effective range."
  STR_RIFLES_UFOPEDIA: "Rifles are very accurate, also at long distances. They often have auto fire mode. Typically, they have better armor penetration capabilities than pistols. They are highly versatile, the only significant disadvantage being that they require both hands."
  STR_CANNONS_UFOPEDIA: "Cannons are big, bulky weapons that deal high damage. They tend to have decent Aimed Shot accuracy and average Snap Shot accuracy. Some Cannons also have Auto-Shot mode and/or unusual ammo."
  STR_LAUNCHERS_UFOPEDIA: "Rocket launchers shoot self-propelled rockets, usually with an explosive charge. They are slow to use and can be heavy, but they deal massive damage and often have good damage radius."
  STR_MACHINE_GUNS_UFOPEDIA: "Machine Guns are powerful, accurate and have good, long auto-shots. They are quite heavy though and have limited use other than suppressive fire."
  STR_CYBERWEB_BATTERY_UFOPEDIA: "High-powered Cyberweb equipment relies on special batteries that seem to employ some very exotic physics. The battery does not contain any power source; instead it uses some sort of interdimensional suction to procure the energy from another plane, possibly another universe. It is not, however, eternal, as its structure easily crumbles under strain, only allowing for some energy to be transferred before it burns up. On the positive side, the battery is completely invisible to all forms of energy detection, unless it is active. The device seems rather experimental, but is very impressive.{NEWLINE}The same Cyberweb battery can be used to power various weapons and equipment, but each time it must be calibrated for a particular device. Various configurations are colour-coded."
