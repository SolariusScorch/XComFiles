  STR_ZOMBIE_STERILE_UFOPEDIA: "These infected humans have been completely overtaken by an alien parasite. They possess little cognitive capabilities and show no higher brain functions; in fact, their brains are mostly consumed by the parasite. They have poor motor skills and reactions to stimuli, but are completely immune to pain. Zombies are incapable of using tools unless directly handed an object, which they will then use as a clubbing instrument. Even though Zombies retain their original bodies, they can no longer be considered human and have a very short life span due to their deteriorated metabolism. We keep them in cages rather than prison cells."
  STR_ALIEN_ALLOYS_UFOPEDIA: "Alien craft are constructed from special alloys with unique properties, placing them in the 'Tritanium' class of materials, previously thought to be only theoretical. They are extremely light and durable, and can be molded by electro-magnetic methods. When desired, they can exhibit shape memory and superelasticity effects while being more durable than any other material known to science - basically a self-healing superalloy. This material can be used in many kinds of manufacturing processes."
