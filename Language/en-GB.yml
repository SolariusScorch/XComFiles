  STR_MEDAL_CARREER_MISSIONS_UFOPEDIA: "Training can only get you so far; truly extraordinary agents are made in the field. This commendation is awarded to agents who successfully completed many missions, starting after the 5th.{NEWLINE}Each level increases Health and Sanity by +1."
