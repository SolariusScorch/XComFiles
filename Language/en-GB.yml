  STR_MASS_DRIVER_RIFLE_UFOPEDIA: "An extended and modified version of the Mass Driver Pistol, the Mass Driver Rifle is a very accurate and extremely powerful hand weapon. The bullets' small size allow for a large clip that takes many shots to deplete. The weapon's obvious downside is a lack of an auto fire setting, as it would cause instant overheating."
  STR_MASS_DRIVER_SNIPER_RIFLE_UFOPEDIA: "The Mass Driver Sniper Rifle is a successful attempt at capitalising on the Mass Driver Rifle's innate strengths. It is yet more powerful and definitely more accurate, allowing X-Com operatives to down tough enemies in just one shot, which renders the weapon's lack of an auto fire mode negligible."
