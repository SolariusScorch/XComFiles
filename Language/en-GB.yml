  STR_BASE_DEFENSE_DIMENSION_X_BRIEFING: "Due to a malfunction in the Transdimensional Receiver, a host of extraplanar life forms has emerged from it. Our base is in severe danger. As per standard procedure all non-combat personnel and X-Com craft have been evacuated. Enemy units will enter the base via hangar doors or the access lift. Defend the base and its vital installations at all costs - this is a fight to the death. If you click on the 'abort mission' icon you will concede defeat and lose the base."
  STR_BASE_DEFENSE_CULT_BRIEFING: "A large group of cultists has arrived at your gates. Our base is in severe danger. As per standard procedure all non-combat personnel and X-Com craft have been evacuated. Enemy units will enter the base via hangar doors or the access lift. Defend the base and its vital installations at all costs - this is a fight to the death. If you click on the 'abort mission' icon you will concede defeat and lose the base."
  STR_STAFF_019_UFOPEDIA: "Commander, I know these past weeks were pretty stressful for you. I also know about that last fruitless interrogation, which probably didn't help either. Therefore, as a medical doctor, I recommend these brightly coloured pills of my personal design. Take one after breakfast and one in the evening, they will make you feel much better. Trust me, they are thoroughly tested."
