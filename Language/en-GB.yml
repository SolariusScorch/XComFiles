  STR_MEDAL_SERVICE_TIME_UFOPEDIA: "The slower you go, the further you'll get.{NEWLINE}Every 6 months of service an agent receives a +1 bonus to Stamina and Health."
  STR_MEDAL_ORIGINAL8_NAME: "Original Member"
  STR_MEDAL_ORIGINAL8_UFOPEDIA: "Being one of the first operatives employed by X-Com is uniquely prestigious. Nothing prepares you for this kind of work like being on the starting team.{NEWLINE}+1 bonus to all stats, except Bravery."
  STR_MEDAL_COMMENDATED: "Commended!"
  STR_MEDAL_COMMENDATED_NAME: "Commended!"
  STR_MEDAL_COMMENDATED_UFOPEDIA: "The higher-ups noticed you and seem to have high expectations of you. Not bad for a Rookie!{NEWLINE}Increases Sanity by +1."
  STR_COMMENDATIONS_UC: "COMMENDATIONS"
  STR_CAREERS_UC: "CAREERS"
  STR_BONUSES_BUTTON: "+"
  STR_LIGHTCYCLING: "Lightcycling"
  STR_LIGHTCYCLING_UFOPEDIA: "We can improve performance of our combat AI units by installing Optronic coprocessors. They can provide a measurable boost to their battle awareness."
  STR_TACTICAL_NEURAL_IMPLANT_USE: "Tactical Implant Installation Program"
  STR_TACTICAL_NEURAL_IMPLANT_INSTALLATION: "Install TNI"
  STR_NINJA_ARTS: "Ninja Arts"
  STR_NINJA_ARTS_UFOPEDIA: "Understanding the profound knowledge of ancient masters was not an easy task. Now we can apply these teachings to our most promising agents, greatly enhancing their physical prowess.{NEWLINE}Requires: TU 60, Stamina 70, Throwing 55, Melee 65, Psi Strength 30, Sanity 70"
  STR_MARTIAL_ARTS_TRAINING: "Martial Arts Training"
  STR_COMBAT_PILOT_TRAINING: "Combat Pilot Training"
  STR_BIO_ENHANCEMENT: "Bio-Enhancement"
  STR_AI_RESTORATION: "AI Unit Restoration"
  STR_CYBER_EYE_MANUFACTURING: "Cyber Eye Manufacturing"
  STR_CYBER_SKIN_MANUFACTURING: "Cyber Skin Manufacturing"
  STR_CYBER_HEART_MANUFACTURING: "Cyber Heart Manufacturing"
  STR_HORMONE_REGULATOR_MANUFACTURING: "Hormone Regulator Manufacturing"
  STR_TACTICAL_NEURAL_IMPLANT: "Tactical Neural Implant"
  STR_TACTICAL_NEURAL_IMPLANT_UFOPEDIA: "Our recent advancements in medicine have enabled us to equip our agents with a special microcomputer, wired directly into the brain. Tactical Neural Implant will significantly boost their reaction times and other combat abilities, at a cost of 10 Sanity. Also, 20% gained Sanity is lost and must be re-learnt from experience. It can be installed in a Sick Bay.{NEWLINE}Requires: Bravery 50, Reactions 50"
  STR_CYBER_EYE: "Cyber Eye"
  STR_CYBER_EYE_UFOPEDIA: "An ocular implant to replace standard cybernetic optics. Provides better image resolution and is more sensitive to light, but still requires a compatible cortex implant to work."
  STR_CYBER_SKIN: "Cyber Skin"
  STR_CYBER_SKIN_UFOPEDIA: "A subdermal mesh of conductive wire, protecting the individual from physical injuries. Regulated by several microchips to ensure proper synchronisation with the surrounding flesh - without it, the implant would lead to fatal consequences. Has to be connected to a compatible master device to work properly."
  STR_CYBER_HEART: "Cyber Heart"
  STR_CYBER_HEART_UFOPEDIA: "Much more than a mechanical pump, this cybernetic implant outperforms its flesh counterpart in circulating the blood, improving an individual's resistance to fatigue and tissue damage. Requires a compatible central unit to properly regulate its function."
  STR_HORMONE_REGULATOR: "Hormone Regulator"
  STR_HORMONE_REGULATOR_UFOPEDIA: "A complex biomechanical device which constantly monitors chemical compounds in the blood and supplements additional hormones when needed. More sophisticated than combat drugs, it enhances both physical performance and combat survivability. Requires a compatible cortex implant to work."
  STR_CYBER_SIGHT_IMPLANTATION: "Cyber Sight Implantation"
  STR_CYBER_SIGHT_IMPLANTATION_UFOPEDIA: "An upgrade for our Kyberi agents, significantly improving their image processing. Grants +2 night vision range and +5 Firing Accuracy at a cost of 5 Sanity.{NEWLINE}Requires Sick Bay to perform."
  STR_SUBDERMAL_MESH_IMPLANTATION: "Subdermal Mesh Implantation"
  STR_SUBDERMAL_MESH_IMPLANTATION_UFOPEDIA: "An upgrade for our Kyberi agents, granting them 5 extra armour regardless of worn outfit. Costs 5 Sanity, but the mesh is so light and flexible that it doesn't limit the agent in any other way.{NEWLINE}Requires Sick Bay to perform."
  STR_CYBERNETIC_HEART_IMPLANTATION: "Cybernetic Heart Implantation"
  STR_CYBERNETIC_HEART_IMPLANTATION_UFOPEDIA: "An upgrade for our Kyberi agents, the ultimate representation of 'the flesh is weak, but machine is strong' trope. An artificial heart significantly improves stamina recovery, and consequently grants better general mobility. The implant also grants additional protection to the chest cavity area (+1 armour, except bottom). However, such a major modification has a heavy toll on one's Sanity, permanently decreasing it by 10.{NEWLINE}Requires Sick Bay to perform."
  STR_HORMONE_REGULATOR_IMPLANTATION: "Hormone Regulator Implantation"
  STR_HORMONE_REGULATOR_IMPLANTATION_UFOPEDIA: "An upgrade for our Kyberi agents, granting them +5 Stamina, a significant boost to stun recovery and a morale bonus as well. However, messing with agents' biochemistry has the downside of reducing their Sanity by 10 points.{NEWLINE}Requires Sick Bay to perform."
  STR_CYBER_SIGHT: "Cyber Sight"
  STR_SUBDERMAL_MESH: "Subdermal Mesh"
  STR_CYBORG: "Cyborg"
  STR_KYBEROS: "Kyberos"
  STR_KYBERISM: "Kyberism"
  STR_KYBERISM_UFOPEDIA: "{ALT}Having studied the pinnacle Cyberweb tech, we have now expanded our mastery over cybernetics to the level of full-body conversion. Combined with techniques derived from Alien Surgery, this allows us to upgrade our agents to Kyberos class cyborgs. With subdermal plating and artificial cortex extensions, Kyberi are tougher and much faster to react. Their only drawback is reduced Stamina, as the augmentations put a heavy toll on their bodies. Kyberi are also more resistant to pain and blood loss, and their cybernetic eyes grant them excellent night vision. They may have access to special outfits (any worn armour is destroyed).{ALT}"
  STR_OLYMPIAN: "Olympian"
  STR_OLYMPIANISM: "Olympianism"
  STR_OLYMPIANISM_UFOPEDIA: "Human and alien destinies have been intertwined since the earliest ages. We now grasp how our psionic frameworks interact and can be bridged, despite our different origins. This in turn allowed us to develop training methods to access previously untapped psionic abilities in humans with strong expression of Nephilim genes (Psi Strength 60+). This allows the subject to manifest their power as a potent psi aura or levitate (flying outfits provide a TU bonus). The subject is sedated and enters an artificial trance lasting a month, which stimulates and trains previously inactive psionic centers in the brain. The process is quite taxing on the psyche, causing the agent to lose 10 Bravery. Any worn outfit is destroyed."
  STR_LOOSE_LIPS: "Loose Lips"
  STR_LOOSE_LIPS_DESCRIPTION: "During an episode of inebriation in a local bar, an X-Com agent revealed classified information to some random unauthorised individuals. Plugging the leak was a little awkward and will cost us some reputation.{NEWLINE}[-25 points]"
  STR_MACRO_SAW: "Macro Saw"
  STR_MUTON_SHADER: "Muton Shader"
  STR_MUTON_SHADER_UFOPEDIA: "These female Mutons have developed brain structures which grant them a psionic cloaking effect. They are also even faster and nimbler, though with a slightly lower muscle mass. These rare units are used for recon and support in major alien operations behind the enemy lines."
  STR_DEATH_DISC: "Death Disc"
  STR_DEATH_DISC_UFOPEDIA: "This throwing weapon is assisted with a micrograv engine, which keeps it spinning in the air. After the disc strikes its target, it automatically returns to the user. Its monomolecular edge makes it a terrifying weapon, able to penetrate even advanced armour."
  STR_FLASHBANG_GRENADE: "Flashbang Grenade"
  STR_THE_THING_POLARNIK: "Civilian"
  STR_THE_THING_DOG_CORPSE: "Dead Dog"
  STR_ALERT_DREAMSCAPE_VILLA: "A CHAKRA HAS ACTIVATED!"
  STR_PILOTS: "Pilots"
  STR_HALLUCINOID_ARMOR: "Hallucinoid Combat Analysis"
  STR_HALLUCINOID_TERRORIST: "Hallucinoid"
  STR_HALLUCINOID: "Hallucinoid"
  STR_HALLUCINOID_UFOPEDIA: "Having harvested the oceans, the aliens have bred these huge Earth creatures as a weapon. Do not be lulled into a false sense of security when facing these harmless looking Sailors of the Deep. Possessing a close combat icy strike and powerful psionic abilities, the Hallucinoid is a deadly foe."
  STR_HALLUCINOID_AUTOPSY: "Hallucinoid Autopsy"
  STR_HALLUCINOID_AUTOPSY_UFOPEDIA: "Nested in the many layers of this organisms gelatinous body is a powerful chemical freezer: its main offensive capability. The soft and supple skin of the Hallucinoid seems susceptible to heat based attacks."
  STR_HALLUCINOID_FREEZE: "Hallucinoid Freeze"
  STR_HALLUCINOID_PSI_WEAPON: "Hallucinoid Mental Attack"
  STR_MALE_MARINE_OFFICER: "Marine Officer"
  STR_MARINE_BASE_DEFENSE: "MARINE BASE DEFENSE"
  STR_MARINE_BASE_ATTACKED: "MARINE BASE UNDER ATTACK!"
  STR_MARINE_BASE_DEFENSE_BRIEFING: "A Hydrospace Dynamics base is under attack! We must rush to their defense, as they cannot withstand the alien attack alone. We will not be able to retreat from this mission."
  STR_MARINE_BASE_DEFENSE_DESCRIPTION: "A Hydrospace Dynamics base is under attack! Repel the alien forces. We will not be able to retreat from this mission."
  STR_CALCINITE_ZAPPER: "Calcinite's Electric Attack"
  STR_CALCINITE_ARMOR: "Calcinite Combat Analysis"
  STR_CALCINITE_AUTOPSY_UFOPEDIA: "Once the armoured suit is stripped away, the Calcinite is revealed to be a huge amorphous blob of protoplasm. No visible brain, limbs or sensory organs exist. A small metallic component resides deep in the liquid body. Once dead we can only guess at the creature's nature. An inexplicable enigma of our alien enemies."
  STR_REPTOID_DRAGONFIRE_TURRET_AUTOPSY_UFOPEDIA: "This immobile firing platform's core consists of an intricate system of emitters and mirrors, protected by heavy terramite armour. It creates and shoots energy bolts."
  STR_FIRE_EXTINGUISHER: "Fire Extinguisher"
  STR_MINOTAUR_AUTOPSY_UFOPEDIA: "This 300 kg beast is protected by armour plates implanted under large areas of its skin. The skull is very sturdy and resistant. Its horns are covered with a titanium alloy, making them an even more formidable weapon."
  STR_UNARMED_SUIT: "Unarmed Attack (Suit)"
  STR_UNARMED_HAZMAT: "Unarmed Attack (Hazmat)"
  STR_UNARMED_TOXI_SUIT: "Unarmed Attack (Toxi-Suit)"
  STR_UNARMED_ARMORED_VEST: "Unarmed Attack (Armoured Vest)"
  STR_UNARMED_ARMORED_VEST_SHIELD: "Unarmed Attack (Armoured Vest/Shield)"
  STR_UNARMED_PERSONAL_ARMOR: "Unarmed Attack (Personal Armour)"
  STR_UNARMED_JUMP_ARMOR: "Flying Kick (Jump Armor)"
  STR_UNARMED_CYBER_ARMOR: "Unarmed Attack (Cyber Armour)"
