  STR_MILESTONE_1: "X-Com Summary Report #1"
  STR_MILESTONE_1_UFOPEDIA: "From: X-Com: Global Investigation Bureau{NEWLINE}To: United Nations Committee{NEWLINE}Subject: Paranormal activity{NEWLINE}Our investigation into anomalous reports around the globe has allowed us to confirm that these incidents are indeed caused by factors which cannot be explained using conventional scientific knowledge. The most striking examples include abnormal biological organisms (see attachment no. 2), but we believe that the greatest concern to the UN is the emergence of clandestine terrorist organisations that seem to be somehow related to this paranormal activity. We strongly recommend that the United Nations Committee takes additional steps to gather more intelligence regarding these groups."
  STR_MILESTONE_2: "X-Com Summary Report #2"
  STR_MILESTONE_2_UFOPEDIA: "From: X-Com: Paranormal Activity Unit{NEWLINE}To: United Nations Committee{NEWLINE}Subject: UFO: Enemy Unknown{NEWLINE}Our investigation into the matter of recent paranormal activity has given us solid proof that the 'cults' are related to some kind of an extraterrestrial force, which actively supports these organisations. The same extraterrestrial force seems to be behind unusual biological phenomena encountered on Earth that we were able to examine in detail. We are not yet aware of the aliens' objectives or modus operandi, but their activity appears to be coordinated and global. Considering that this activity seems to promote disorder and danger to human life, we are suggesting that the aliens should be regarded as hostile to humanity for the time being, and that greater means are necessary to gather more information regarding this threat."
  STR_MILESTONE_3: "X-Com Summary Report #3"
  STR_MILESTONE_3_UFOPEDIA: "From: X-Com: Paranormal Security Agency{NEWLINE}To: United Nations Committee{NEWLINE}Subject: Alien Conspiracy{NEWLINE}Our conclusions regarding all alien activity are quite grim: not only are we besieged by hostile alien forces, but our higher echelons of power are also deeply infiltrated. Moreover, we are threatened not by just one force, but a number of possible competitors: the mysterious aliens from the skies, the undersea civilization of the Deep Ones, an unknown world beneath the surface of the Earth and finally the human collaborators. We estimate that none of them are ready for a full-on invasion yet, but they will do what they can to weaken and confuse us.{NEWLINE}Therefore I strongly recommend a more focused approach to building up Earth's defences, starting with giving X-Com full military rights to intervene on behalf of not just the UN, but all of humanity."
  STR_MILESTONE_3_PREQ: "Promotion III Prerequisite"
  STR_HWP_UC: "MECHANICAL UNITS"
  STR_HWP: "Heavy Weapon Platforms"
  STR_HWP_UFOPEDIA: "In response to the dangers inherent in X-Com activities, we have developed a multi-purpose unmanned Heavy Weapons Platform. The turret is semi-modular and can house either a cannon, a twin rocket launcher or a minigun. Its sturdy armour is highly resistant to most forms of damage. Due to its size, a Heavy Weapon Platform requires a significant amount of dedicated cargo space for transport."
